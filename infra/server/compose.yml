name: valora-server

x-app: &app
  restart: unless-stopped
  user: "10001:10001"
  init: false
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  environment: &environment
    VALORA_ENV: production
    VALORA_LOG_LEVEL: INFO
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: valora
    POSTGRES_USER: valora
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://minio:9000
    S3_BUCKET: valora-source-artifacts
    S3_REGION: us-east-1
    DOCUMENT_BLOB_PROVIDER: local
    DOCUMENT_BLOB_ROOT: /var/lib/valora/document-blobs
    BACKEND_CORS_ORIGINS: https://${VALORA_HOSTNAME:?set approved hostname}
    VALORA_SCHEMA_HEAD: ${VALORA_SCHEMA_HEAD:?set exact image schema head}
  secrets: [postgres_password, app_secret_key, s3_access_key, s3_secret_key]
  volumes:
    - type: bind
      source: ./runtime.py
      target: /opt/server/runtime.py
      read_only: true
    - type: bind
      source: ${VALORA_BLOB_ROOT:?set pre-provisioned blob root}
      target: /var/lib/valora/document-blobs
      bind:
        create_host_path: false
  networks: [data]
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  ingress:
    image: ${VALORA_INGRESS_IMAGE:?digest required}
    restart: unless-stopped
    environment:
      VALORA_HOSTNAME: ${VALORA_HOSTNAME:?set approved hostname}
      NGINX_ENVSUBST_FILTER: ^VALORA_HOSTNAME$
    ports:
      - target: 443
        published: "443"
        host_ip: ${VALORA_LAN_IP:?set explicitly approved LAN interface}
        protocol: tcp
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    secrets: [tls_certificate, tls_private_key]
    networks: [edge, app]
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_started}
    security_opt: [no-new-privileges:true]
    logging: *logging

  frontend:
    image: ${VALORA_FRONTEND_IMAGE:?digest required}
    restart: unless-stopped
    volumes:
      - ./frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [app]
    security_opt: [no-new-privileges:true]
    logging: *logging

  backend:
    <<: *app
    image: ${VALORA_BACKEND_IMAGE:?digest required}
    command: [python, /opt/server/runtime.py, backend]
    networks: [app, data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    healthcheck:
      test: [CMD, python, /opt/server/runtime.py, ready, backend]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    image: ${VALORA_WORKER_IMAGE:?digest required}
    command: [python, /opt/server/runtime.py, worker]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, /opt/server/runtime.py, ready, worker]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  postgres:
    image: ${VALORA_POSTGRES_IMAGE:?digest required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: valora
      POSTGRES_USER: valora
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD, pg_isready, -U, valora, -d, valora]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    logging: *logging

  redis:
    image: ${VALORA_REDIS_IMAGE:?digest required}
    restart: unless-stopped
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    logging: *logging

  minio:
    image: ${VALORA_MINIO_IMAGE:?digest required}
    restart: unless-stopped
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    secrets: [s3_access_key, s3_secret_key]
    volumes: [source_artifacts:/data]
    networks: [data]
    security_opt: [no-new-privileges:true]
    logging: *logging

networks:
  edge: {}
  app: {internal: true}
  data: {internal: true}

volumes:
  postgres_data: {}
  source_artifacts: {}

secrets:
  postgres_password: {file: "${VALORA_SECRET_DIR:?external secret directory}/postgres_password"}
  app_secret_key: {file: "${VALORA_SECRET_DIR:?external secret directory}/app_secret_key"}
  s3_access_key: {file: "${VALORA_SECRET_DIR:?external secret directory}/s3_access_key"}
  s3_secret_key: {file: "${VALORA_SECRET_DIR:?external secret directory}/s3_secret_key"}
  tls_certificate: {file: "${VALORA_SECRET_DIR:?external secret directory}/tls_certificate.pem"}
  tls_private_key: {file: "${VALORA_SECRET_DIR:?external secret directory}/tls_private_key.pem"}
