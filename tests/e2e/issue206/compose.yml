name: valora-issue206-20261018
services:
  postgres:
    image: postgres:16
    pull_policy: never
    environment:
      POSTGRES_DB: valora_issue206
      POSTGRES_USER: valora
      POSTGRES_PASSWORD: synthetic_issue206_local
    volumes: ["issue206_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valora -d valora_issue206"]
      interval: 2s
      timeout: 5s
      retries: 15
  objects:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    pull_policy: never
    command: server /data
    environment:
      MINIO_ROOT_USER: valora
      MINIO_ROOT_PASSWORD: synthetic_issue206_local
    volumes: ["issue206_objects:/data"]
  backend:
    # Cached dependency image only; exact task backend is mounted read-only. No #199 resources.
    image: valora-biz199-01a1303b-fixture:local-20261012
    pull_policy: never
    working_dir: /app
    volumes: ["../../../backend:/app:ro", ".:/acceptance:ro", "issue206_blobs:/var/lib/valora/issue206"]
    ports: ["127.0.0.1:58206:8000"]
    environment:
      VALORA_ENV: development
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: valora_issue206
      POSTGRES_USER: valora
      POSTGRES_PASSWORD: synthetic_issue206_local
      TEST_DATABASE_URL: postgresql+psycopg://valora:synthetic_issue206_local@postgres:5432/valora_issue206
      S3_ENDPOINT_URL: http://objects:9000
      S3_ACCESS_KEY_ID: valora
      S3_SECRET_ACCESS_KEY: synthetic_issue206_local
      S3_BUCKET: valora-issue206-synthetic
      DOCUMENT_BLOB_PROVIDER: local
      DOCUMENT_BLOB_ROOT: /var/lib/valora/issue206
      APP_SECRET_KEY: synthetic-issue206-independent-test-key-only
      BACKEND_CORS_ORIGINS: http://localhost:51206
      ISSUE206_SYNTHETIC_PASSWORD: synthetic-issue206-browser-only
    depends_on:
      postgres: { condition: service_healthy }
      objects: { condition: service_started }
volumes:
  issue206_postgres:
  issue206_objects:
  issue206_blobs:
